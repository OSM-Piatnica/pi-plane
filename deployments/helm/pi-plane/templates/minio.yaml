{{- if .Values.objectStorage.bundled.enabled }}
{{- $comp := dict "root" . "component" "minio" }}
{{- $spec := .Values.objectStorage.bundled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pi-plane.componentName" $comp }}
  labels:
    {{- include "pi-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  replicas: 1
  serviceName: {{ include "pi-plane.componentName" $comp }}
  selector:
    matchLabels:
      {{- include "pi-plane.selectorLabels" $comp | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pi-plane.labels" . | nindent 8 }}
        app.kubernetes.io/component: minio
    spec:
      serviceAccountName: {{ include "pi-plane.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: minio
          image: "{{ $spec.image.repository }}:{{ $spec.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["server", "/export", "--console-address", ":9090"]
          ports:
            - name: s3
              containerPort: 9000
          env:
            # The same keys the API signs its requests with
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "pi-plane.secretName" . }}
                  key: AWS_ACCESS_KEY_ID
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pi-plane.secretName" . }}
                  key: AWS_SECRET_ACCESS_KEY
          volumeMounts:
            - name: data
              mountPath: /export
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: s3 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /minio/health/live, port: s3 }
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            {{- toYaml $spec.resources | nindent 12 }}
      {{- include "pi-plane.scheduling" $spec | nindent 6 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $spec.storage.className }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $spec.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pi-plane.componentName" $comp }}
  labels:
    {{- include "pi-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  selector:
    {{- include "pi-plane.selectorLabels" $comp | nindent 4 }}
  ports:
    - name: s3
      port: 9000
      targetPort: s3
{{- end }}
