{{- $comp := dict "root" . "component" "live" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pi-plane.componentName" $comp }}
  labels:
    {{- include "pi-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: live
spec:
  replicas: {{ .Values.live.replicas }}
  selector:
    matchLabels:
      {{- include "pi-plane.selectorLabels" $comp | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pi-plane.labels" . | nindent 8 }}
        app.kubernetes.io/component: live
      {{- with .Values.live.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "pi-plane.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: live
          image: {{ include "pi-plane.image" $comp | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: API_BASE_URL
              value: {{ printf "http://%s:8000" (include "pi-plane.componentName" (dict "root" . "component" "api")) | quote }}
            - name: WEB_BASE_URL
              value: {{ required "publicUrl is required, e.g. https://plane.example.com" .Values.publicUrl | quote }}
            - name: LIVE_BASE_URL
              value: {{ .Values.publicUrl | quote }}
            - name: LIVE_BASE_PATH
              value: "/live"
            - name: LIVE_SERVER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "pi-plane.secretName" . }}
                  key: LIVE_SERVER_SECRET_KEY
            {{- if .Values.valkey.enabled }}
            - name: REDIS_URL
              value: {{ printf "redis://%s:6379/" (include "pi-plane.valkeyHost" .) | quote }}
            - name: REDIS_HOST
              value: {{ include "pi-plane.valkeyHost" . | quote }}
            - name: REDIS_PORT
              value: "6379"
            {{- else }}
            {{- include "pi-plane.externalUrlEnv" (dict "name" "REDIS_URL" "external" .Values.valkey.external) | nindent 12 }}
            {{- end }}
            {{- with .Values.live.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            {{- include "pi-plane.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.live.resources | nindent 12 }}
      {{- include "pi-plane.scheduling" .Values.live | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pi-plane.componentName" $comp }}
  labels:
    {{- include "pi-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: live
spec:
  selector:
    {{- include "pi-plane.selectorLabels" $comp | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
