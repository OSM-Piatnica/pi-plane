*/ -}}
{{- if .Values.gateway.enabled }}
{{- if not .Values.gateway.parentRefs }}
{{- fail "gateway.parentRefs is required when gateway.enabled is true" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "pi-plane.fullname" . }}
  labels:
    {{- include "pi-plane.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.gateway.parentRefs | nindent 4 }}
  hostnames:
    - {{ include "pi-plane.host" . | quote }}
  rules:
    {{- range include "pi-plane.routes" . | fromYamlArray }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ .path }}
      backendRefs:
        - name: {{ include "pi-plane.componentName" (dict "root" $ "component" .component) }}
          port: {{ .port }}
    {{- end }}
{{- end }}
