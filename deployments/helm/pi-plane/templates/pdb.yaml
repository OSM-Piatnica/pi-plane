{{- range $name := list "api" "live" "web" "space" "admin" }}
{{- $values := index $.Values $name }}
{{- if and $values.pdb.enabled (or (ne $name "space") $values.enabled) }}
{{- $comp := dict "root" $ "component" $name }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "pi-plane.componentName" $comp }}
  labels:
    {{- include "pi-plane.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  minAvailable: {{ $values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "pi-plane.selectorLabels" $comp | nindent 6 }}
{{- end }}
{{- end }}
