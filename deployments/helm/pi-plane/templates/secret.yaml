{{- if not .Values.secrets.existingSecret }}
{{- /* The generated values survive upgrades because they are read back from the Secret this chart created.
       lookup returns nothing under "helm template" and "--dry-run", where fresh values are printed. */ -}}
{{- $name := include "pi-plane.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if $existing }}{{- $data = $existing.data }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "pi-plane.labels" . | nindent 4 }}
  annotations:
    # Losing these makes the data unreadable (Django signing key, database and storage passwords)
    helm.sh/resource-policy: keep
type: Opaque
data:
  SECRET_KEY: {{ get $data "SECRET_KEY" | default (randAlphaNum 64 | b64enc) | quote }}
  LIVE_SERVER_SECRET_KEY: {{ get $data "LIVE_SERVER_SECRET_KEY" | default (randAlphaNum 48 | b64enc) | quote }}
  POSTGRES_PASSWORD: {{ get $data "POSTGRES_PASSWORD" | default (randAlphaNum 32 | b64enc) | quote }}
  RABBITMQ_PASSWORD: {{ get $data "RABBITMQ_PASSWORD" | default (randAlphaNum 32 | b64enc) | quote }}
  AWS_ACCESS_KEY_ID: {{ get $data "AWS_ACCESS_KEY_ID" | default (randAlphaNum 20 | b64enc) | quote }}
  AWS_SECRET_ACCESS_KEY: {{ get $data "AWS_SECRET_ACCESS_KEY" | default (randAlphaNum 40 | b64enc) | quote }}
{{- end }}
