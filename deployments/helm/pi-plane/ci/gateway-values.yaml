# Gateway API routing, isolation and availability settings together.
publicUrl: https://plane.example.com
ingress:
  enabled: false
gateway:
  enabled: true
  parentRefs:
    - name: shared-gateway
      namespace: gateway
      sectionName: https
networkPolicy:
  enabled: true
  ingressNamespace: envoy-gateway-system
api: { replicas: 2, pdb: { enabled: true, minAvailable: 1 } }
web: { replicas: 2, pdb: { enabled: true, minAvailable: 1 } }
live: { replicas: 2, pdb: { enabled: true, minAvailable: 1 } }
worker: { replicas: 2 }
