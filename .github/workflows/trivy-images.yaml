name: Trivy Images

# Scans the published Pi-Plane images for known vulnerabilities in their OS packages and bundled
# binaries, which lockfile tools (Dependabot, pnpm audit) cannot see. Runs weekly because new
# advisories appear against images that have not changed. The release gate in publish-images.yaml
# scans each image before it is tagged.
#
# Reports fixable HIGH and CRITICAL findings only (--ignore-unfixed). Findings land in the
# Security tab (code scanning, one category per image); the job fails so a weekly run is visible.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to scan
        default: latest
        required: true
        type: string

permissions:
  contents: read
  packages: read
  security-events: write

env:
  IMAGE_PREFIX: ghcr.io/osm-piatnica/pi-plane

jobs:
  scan:
    name: Scan ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: all-in-one
            image: ghcr.io/osm-piatnica/pi-plane
          - name: web
            image: ghcr.io/osm-piatnica/pi-plane-web
          - name: space
            image: ghcr.io/osm-piatnica/pi-plane-space
          - name: admin
            image: ghcr.io/osm-piatnica/pi-plane-admin
          - name: live
            image: ghcr.io/osm-piatnica/pi-plane-live
          - name: api
            image: ghcr.io/osm-piatnica/pi-plane-api
          - name: proxy
            image: ghcr.io/osm-piatnica/pi-plane-proxy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Trivy
        uses: ./.github/actions/setup-trivy

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan (SARIF report)
        env:
          IMAGE_REF: ${{ matrix.image }}:${{ inputs.tag || 'latest' }}
        run: |
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --ignorefile .trivyignore \
            --format sarif \
            --output trivy.sarif \
            --exit-code 0 \
            "$IMAGE_REF"

      - name: Upload to code scanning
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.name }}

      - name: Fail on findings
        env:
          IMAGE_REF: ${{ matrix.image }}:${{ inputs.tag || 'latest' }}
        run: |
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --ignorefile .trivyignore \
            --format table \
            --exit-code 1 \
            "$IMAGE_REF"
