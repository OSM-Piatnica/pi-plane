name: i18n sync check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "preview"
    types:
      - "opened"
      - "synchronize"
      - "reopened"
      - "ready_for_review"
      - "edited"
    paths:
      - "packages/i18n/**"
      - ".github/workflows/i18n-sync-check.yml"
  push:
    branches:
      - "preview"
    paths:
      - "packages/i18n/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # a skipped `edited` run (title/description edit) must not cancel the real run of the latest push
  cancel-in-progress: ${{ github.event.action != 'edited' || github.event.changes.base != null }}

permissions:
  contents: read

jobs:
  sync-check:
    name: check:sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push' || (github.event.pull_request.draft == false && (github.event.action != 'edited' || github.event.changes.base != null))
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"

      - name: Enable Corepack and pnpm
        run: corepack enable pnpm

      - name: Run sync check
        # Reports only (no --ci): this fork actively maintains en/pl, but carries
        # the other locales as-is from upstream, so most of them are genuinely
        # incomplete against our fork-only keys. Failing the build on that would
        # just train people to ignore a permanently-red check.
        run: pnpm dlx tsx packages/i18n/scripts/sync-check.ts
