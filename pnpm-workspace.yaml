  morgan: 1.12.1
  "ws@8": 8.22.0
  "ws@7": 7.5.13
  "linkify-it": 5.0.2
  "body-parser": 1.20.8
  "js-yaml@4": 4.3.2
  "sanitize-html": 2.18.1
  compression: 1.8.2
  "proxy-addr": 2.0.8
  "source-map-js": 1.2.2
  "@babel/core": 7.29.7
  browserslist: 4.29.3
  "baseline-browser-mapping": 2.11.28
  # No 6.x fix for the postcss-selector-parser advisory (fixed in 7.1.6). @tailwindcss/typography
  # (space app) pins 6.0.10 but only uses parser()/selector(); 7.x is compatible with that use.
  postcss-selector-parser: 7.1.6
  tinypool: 2.2.0
  "webpack-dev-middleware@6": 7.4.6
  "webpack-dev-middleware@7": 7.4.6
  "fast-uri@3": 3.1.8
  "prosemirror-model": 1.25.12

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  "msgpackr-extract": true
  turbo: true
  sharp: false

# pnpm 11 no longer reads pnpm settings from .npmrc; keep the repo's choices here.
nodeLinker: isolated
autoInstallPeers: true
strictPeerDependencies: false
resolutionMode: highest
publicHoistPattern:
  - typescript
  - eslint
  - "*@plane/*"
  - vite
  - turbo

# Exact versions already in the lockfile that are younger than pnpm 11's default 1-day
# minimumReleaseAge; drop entries once they have aged out.
minimumReleaseAgeExclude:
  - "@rolldown/binding-android-arm-eabi@1.2.14"
  - "@rolldown/binding-android-arm64@1.2.14"
  - "@rolldown/binding-darwin-arm64@1.2.14"
  - "@rolldown/binding-darwin-x64@1.2.14"
  - "@rolldown/binding-freebsd-x64@1.2.14"
  - "@rolldown/binding-linux-arm-gnueabihf@1.2.14"
  - "@rolldown/binding-linux-arm64-gnu@1.2.14"
  - "@rolldown/binding-linux-arm64-musl@1.2.14"
  - "@rolldown/binding-linux-ppc64-gnu@1.2.14"
  - "@rolldown/binding-linux-s390x-gnu@1.2.14"
  - "@rolldown/binding-linux-x64-gnu@1.2.14"
  - "@rolldown/binding-linux-x64-musl@1.2.14"
  - "@rolldown/binding-openharmony-arm64@1.2.14"
  - "@rolldown/binding-win32-arm64-msvc@1.2.14"
  - "@rolldown/binding-win32-x64-msvc@1.2.14"
  - "@storybook/icons@2.2.0"
  - "chromatic@18.12.2"
  - "rolldown@1.2.14"
  - "sanitize-html@2.18.1"
