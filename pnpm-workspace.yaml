packages:
  - apps/*
  - packages/*
  - "!apps/api"
  - "!apps/proxy"

catalog:
  "@atlaskit/pragmatic-drag-and-drop-auto-scroll": 1.4.0
  "@atlaskit/pragmatic-drag-and-drop-hitbox": 1.1.0
  "@atlaskit/pragmatic-drag-and-drop": 1.7.4
  "@bprogress/core": ^1.3.4
  "dotenv": 16.4.7
  "@react-router/dev": 8.3.0
  "@react-router/node": 8.3.0
  "@react-router/serve": 8.3.0
  "@tiptap/core": ^2.27.3
  "@tiptap/html": ^2.22.3
  "@types/lodash-es": 4.17.12
  "@types/node": 22.12.0
  "@types/react-dom": 19.2.3
  "@types/react": 19.2.17
  axios: 1.20.0
  express: 4.22.0
  i18next: 25.10.9
  i18next-icu: 2.4.3
  i18next-resources-to-backend: 1.2.1
  lodash-es: 4.18.0
  lucide-react: 0.469.0
  mobx-react: 9.2.2
  mobx-utils: 6.0.8
  mobx: 6.12.0
  react-dom: 19.2.8
  react-is: ^19.2.8
  react-router: 8.3.0
  react: 19.2.8
  react-i18next: 16.6.6
  swr: 2.4.2
  tsdown: 0.16.0
  tsx: 4.20.6
  typescript: 5.8.3
  uuid: 14.0.0
  vite: 8.3.4

overrides:
  # @makeplane/propel and @plane/blocks must share one Base UI copy: two copies mean two
  # React contexts, so a blocks part rendered inside a propel root cannot see it. 1.6 is also
  # what propel was built against; the 1.9 line changes the toast manager types.
  "@base-ui/react": 1.6.0
  # Force a single React across the whole graph. With node-linker=isolated,
  # auto-install-peers and resolution-mode=highest, a dependency still declaring a
  # React 18 peer can otherwise pull in a second copy, which surfaces as an invalid
  # hook call rather than as an install error.
  react: "catalog:"
  react-dom: "catalog:"
  react-is: "catalog:"
  "@types/react": "catalog:"
  "@types/react-dom": "catalog:"
  # @react-router/serve v8 needs Express 5 (it mounts with `app.all("/{*splat}")`, which
  # Express 4 silently fails to match). The catalog stays on Express 4 for apps/live,
  # which depends on express-ws (Express 4 only).
  "@react-router/serve>express": "^5.2.1"
  # Express 5's router needs path-to-regexp 8; the global pin below is for Express 4.
  "router>path-to-regexp": "^8.4.2"
  express: "catalog:"
  "mdast-util-to-hast": 13.2.1
  valibot: 1.5.0
  glob: 11.1.0
  "brace-expansion": 5.0.12
  nanoid: 3.3.20
  esbuild: 0.28.2
  "@babel/helpers": 7.29.7
  "@babel/runtime": 7.29.7
  chokidar: 3.6.0
  "prosemirror-view": 1.42.6
  "@types/express": 4.17.23
  typescript: "catalog:"
  vite: "catalog:"
  qs: 6.16.0
  diff: 5.2.2
  webpack: 5.104.1
  "lodash-es": "catalog:"
  lodash: 4.18.1
  "markdown-it": 14.3.3
  rollup: 4.59.0
  "minimatch@3": 3.1.4
  "minimatch@10": 10.2.3
  "serialize-javascript": 7.0.5
  "ajv@6": 6.14.0
  "ajv@8": 8.18.0
  "undici@7": 7.30.0
  flatted: 3.4.2
  picomatch: 2.3.2
  "yaml@1": 1.10.3
  "yaml@2": 2.8.3
  "path-to-regexp": 0.1.13
  defu: 6.1.5
  postcss: 8.5.30
  axios: "catalog:"
  "follow-redirects": 1.16.1
  uuid: "catalog:"
  tmp: 0.2.7
  "form-data": 4.0.6
  morgan: 1.12.1
  "ws@8": 8.22.0
  "ws@7": 7.5.13
  "linkify-it": 5.0.2
  "body-parser": 1.20.8
  "js-yaml@4": 4.3.2
  "sanitize-html": 2.18.1
  compression: 1.8.2
  "proxy-addr": 2.0.8
  "source-map-js": 1.2.2
  "@babel/core": 7.29.7
  browserslist: 4.29.3
  "baseline-browser-mapping": 2.11.28
  # No 6.x fix for the postcss-selector-parser advisory (fixed in 7.1.6). @tailwindcss/typography
  # (space app) pins 6.0.10 but only uses parser()/selector(); 7.x is compatible with that use.
  postcss-selector-parser: 7.1.6
  tinypool: 2.2.0
  "webpack-dev-middleware@6": 7.4.6
  "webpack-dev-middleware@7": 7.4.6
  "fast-uri@3": 3.1.8
  "prosemirror-model": 1.25.12

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  "msgpackr-extract": true
  turbo: true
  sharp: false

# pnpm 11 no longer reads pnpm settings from .npmrc; keep the repo's choices here.
nodeLinker: isolated
autoInstallPeers: true
strictPeerDependencies: false
resolutionMode: highest
publicHoistPattern:
  - typescript
  - eslint
  - "*@plane/*"
  - vite
  - turbo

# Exact versions already in the lockfile that are younger than pnpm 11's default 1-day
# minimumReleaseAge; drop entries once they have aged out.
minimumReleaseAgeExclude:
  - "@rolldown/binding-android-arm-eabi@1.2.14"
  - "@rolldown/binding-android-arm64@1.2.14"
  - "@rolldown/binding-darwin-arm64@1.2.14"
  - "@rolldown/binding-darwin-x64@1.2.14"
  - "@rolldown/binding-freebsd-x64@1.2.14"
  - "@rolldown/binding-linux-arm-gnueabihf@1.2.14"
  - "@rolldown/binding-linux-arm64-gnu@1.2.14"
  - "@rolldown/binding-linux-arm64-musl@1.2.14"
  - "@rolldown/binding-linux-ppc64-gnu@1.2.14"
  - "@rolldown/binding-linux-s390x-gnu@1.2.14"
  - "@rolldown/binding-linux-x64-gnu@1.2.14"
  - "@rolldown/binding-linux-x64-musl@1.2.14"
  - "@rolldown/binding-openharmony-arm64@1.2.14"
  - "@rolldown/binding-win32-arm64-msvc@1.2.14"
  - "@rolldown/binding-win32-x64-msvc@1.2.14"
  - "@storybook/icons@2.2.0"
  - "chromatic@18.12.2"
  - "rolldown@1.2.14"
  - "sanitize-html@2.18.1"

peerDependencyRules:
  allowedVersions:
    # Peer ranges predate React 19, but none of these use anything React 19 removed
    # (findDOMNode, string refs, element.ref reads, defaultProps on function components).
    "react-masonry-component>react": "19"
    "use-font-face-observer>react": "19"
  # @tailwindcss/typography (web, space) lists tailwindcss as a peer, but only packages/tailwind-config
  # depends on it. Declaring it in the apps makes Vite externalize it in the server build and the
  # `@import "tailwindcss"` inside tailwind-config/index.css then fails to resolve (ENOENT apps/<app>/tailwindcss).
  ignoreMissing:
    - tailwindcss
